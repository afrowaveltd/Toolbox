# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  windows-ui:
    name: Windows UI regression tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: FileBrowser UI tests
      run: dotnet test Blackboard/SpectreConsole/FileBrowser.Tests/Afrowave.Toolbox.Blackboard.SpectreConsole.FileBrowser.Tests.csproj -c Release
    - name: UnderstandMe Configurator UI tests
      run: dotnet test UnderstandMe/Tools/Configurator.Tests/UnderstandMe.Configurator.Tests.csproj -c Release
    - name: Blackboard Showcase UI tests
      run: dotnet test Blackboard/Samples/Blackboard.Showcase.Tests/Blackboard.Showcase.Tests.csproj -c Release
    - name: UnderstandMe localization concurrency tests
      run: dotnet test UnderstandMe.Tests/UnderstandMe.Tests.csproj -c Release --filter "FullyQualifiedName~DictionaryTextLocalizerTests"
    - name: ExchangeHouse Markdown tests
      run: dotnet test ExchangeHouse/Markdown.Tests/Afrowave.Toolbox.ExchangeHouse.Markdown.Tests.csproj -c Release
    - name: Blackboard Markdown tests
      run: dotnet test Blackboard/SpectreConsole/Markdown.Tests/Afrowave.Toolbox.Blackboard.SpectreConsole.Markdown.Tests.csproj -c Release
    - name: Optional Markdown TextMate tests
      run: dotnet test Blackboard/SpectreConsole/Markdown.TextMate.Tests/Afrowave.Toolbox.Blackboard.SpectreConsole.Markdown.TextMate.Tests.csproj -c Release


  mdview-benchmark-build:
    name: MdView benchmark compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Validate Linux Bash launcher syntax
      if: runner.os == 'Linux'
      run: bash -n Blackboard/Tools/MdView.Benchmarks/run.sh
    - name: Validate Windows PowerShell launcher syntax
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $tokens = $null
        $parseErrors = $null
        [System.Management.Automation.Language.Parser]::ParseFile(
          'Blackboard/Tools/MdView.Benchmarks/run.ps1',
          [ref]$tokens,
          [ref]$parseErrors) | Out-Null
        if ($parseErrors.Count -gt 0) {
          $parseErrors | Format-List | Out-String | Write-Error
          exit 1
        }
    - name: Compile isolated benchmark utility (no HDD workload)
      run: dotnet build Blackboard/Tools/MdView.Benchmarks/MdView.Benchmarks.csproj -c Release --nologo
    - name: Verify RAM-only log buffering and delayed export (no HDD workload)
      run: dotnet Blackboard/Tools/MdView.Benchmarks/bin/Release/net10.0/MdView.Benchmarks.dll --self-test-log-buffer
    - name: Verify opt-in journal timings preserve data and counters
      run: dotnet test Blackboard/Tools/MdView.Tests/MdView.Tests.csproj -c Release --filter "FullyQualifiedName~OptionalJournalTimingsMeasureEachWriteWithoutChangingJournal" --nologo
    - name: Verify sequential journal appends only reposition after backward replay
      run: dotnet test Blackboard/Tools/MdView.Tests/MdView.Tests.csproj -c Release --filter "FullyQualifiedName~SequentialJournalAppendsDoNotSeekAgainUntilBackwardReplayMovesStream" --nologo

  documentation-links:
    name: Markdown local documentation links
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check local Markdown links
      run: python3 Toolroom/Documentation/Check-Markdown-Links.py
