          GH_TOKEN: ${{ github.token }}
        run: |
          test -f dist/packages/mdview-0.1.0-preview.2-win-x64.zip
          test -f dist/packages/mdview-0.1.0-preview.2-linux-x64.tar.gz
          gh release create mdview-v0.1.0-preview.2 dist/packages/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MdView 0.1.0-preview.2" \
            --notes-file Blackboard/Tools/MdView/Docs/Second-Preview-Release/en.md \
            --prerelease
